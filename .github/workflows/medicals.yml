name: Build & Package PharmacyERP

on:
  push:
    tags: 
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_PATH: ./Shsmg.Pharma.WebUI/Shsmg.Pharma.WebUI.csproj
  APP_NAME: PharmacyERP

jobs:

  build-app:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: |
          $version = "1.0.${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish & Generate Installer
        run: |
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:CreateInstaller=true `
            -o publish_output

      - name: Zip Published App
        shell: pwsh
        run: |
          Compress-Archive -Path publish_output\* -DestinationPath "$env:APP_NAME-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: ${{ env.APP_NAME }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: installer-package
          path: installer/output/*.exe


  release:
    runs-on: windows-latest
    permissions: 
      contents: write
    needs: build-app

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-package

      - uses: actions/download-artifact@v4
        with:
          name: installer-package

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-app.outputs.version }}
          name: PharmacyERP v${{ needs.build-app.outputs.version }}
          files: |
            PharmacyERP-win-x64.zip
            *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
